name: Compile sketches

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install arduino-cli
        env:
          ARDUINO_CLI_VERSION: "1.5.1"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version
      - name: Install the AVR core
        run: make setup
      - name: Compile every exercise for Arduino Uno
        run: make compile
